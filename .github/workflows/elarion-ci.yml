name: Elarion CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: elarion-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get -y install ninja-build

      - uses: actions/cache@v4
        with:
          path: downloads
          key: ${{ runner.os }}-downloads-${{ hashFiles('CMakeLists.txt') }}-${{ hashFiles('**/cmake/*') }}

      - name: Build firmware
        run: |
          mkdir -p build && cd build
          cmake -DWARNINGS_AS_ERRORS=ON -DMAIN_COMPILE_OPTIONS=-pipe -G Ninja ..
          ninja -j$(nproc) ELARIONH743 ELARIONH743SD ELARIONF405

      - uses: actions/upload-artifact@v4
        with:
          name: elarion-firmware-${{ github.sha }}
          path: build/*.hex
          if-no-files-found: error
